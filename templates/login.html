{% extends "base.html" %}
{% block title %}Login &mdash; The Royal Gym{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-icon">&#127947;</span>
                <h2>Welcome Back</h2>
                <p>Sign in to The Royal Gym</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST" id="loginForm" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="login-email">Email Address <span class="required">*</span></label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="#9ca3af" stroke-width="2"/>
                                <polyline points="22,6 12,13 2,6" stroke="#9ca3af" stroke-width="2"/>
                            </svg>
                        </span>
                        <input type="email" id="login-email" name="email" placeholder="your@email.com" value="{{ email or '' }}" maxlength="150" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password">Password <span class="required">*</span></label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="#9ca3af" stroke-width="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </span>
                        <input type="password" id="login-password" name="password" placeholder="Enter your password" maxlength="128" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

        </div>
    </div>
</section>
{% endblock %}
